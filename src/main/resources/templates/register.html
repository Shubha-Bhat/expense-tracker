<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ExpenseFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        body::before { content: ''; position: absolute; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 40px 40px; animation: moveBg 20s linear infinite; }
        @keyframes moveBg { 0% { transform: translate(0, 0); } 100% { transform: translate(40px, 40px); } }
        .login-card { background: white; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); max-width: 450px; width: 90%; position: relative; z-index: 1; animation: fadeInUp 0.6s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; text-align: center; border-radius: 32px 32px 0 0; }
        .login-header i { font-size: 3rem; margin-bottom: 15px; }
        .login-header h2 { font-weight: 800; margin-bottom: 8px; }
        .login-header p { opacity: 0.9; font-size: 0.9rem; }
        .login-body { padding: 40px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { font-weight: 600; margin-bottom: 8px; color: #1a202c; display: block; }
        .input-group { position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #a0aec0; z-index: 1; }
        .form-control { width: 100%; padding: 12px 15px 12px 45px; border: 2px solid #e2e8f0; border-radius: 14px; font-family: 'Inter', sans-serif; transition: all 0.3s; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); outline: none; }
        .btn-login { width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 1rem; transition: all 0.3s; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4); }
        .btn-back { width: 100%; background: white; border: 2px solid #e2e8f0; padding: 12px; border-radius: 14px; font-weight: 600; color: #4a5568; transition: all 0.3s; text-decoration: none; display: inline-block; text-align: center; margin-top: 15px; }
        .btn-back:hover { border-color: #667eea; color: #667eea; text-decoration: none; }
        .alert { border-radius: 14px; padding: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-user-plus"></i>
            <h2>Create Account</h2>
            <p>Join ExpenseFlow today</p>
        </div>
        
        <div class="login-body">
            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${error}">Error message</span>
            </div>

            <!-- FIX: Added autocomplete="off" to the form -->
            <form th:action="@{/register}" method="post" autocomplete="off">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" name="name" class="form-control" placeholder="Enter your full name" required autocomplete="off">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required autocomplete="off">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <!-- FIX: autocomplete="new-password" prevents browsers from suggesting old saved passwords -->
                        <input type="password" name="password" class="form-control" placeholder="Create a password" required autocomplete="new-password">
                    </div>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-user-plus me-2"></i>Create Account
                </button>
            </form>
            
            <a th:href="@{/login}" class="btn-back">
                <i class="fas fa-arrow-left me-2"></i>Back to Login
            </a>
        </div>
    </div>
</body>
</html>
